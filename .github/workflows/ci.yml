name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adminai
          POSTGRES_PASSWORD: adminai
          POSTGRES_DB: adminai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminai -d adminai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://adminai:adminai@localhost:5432/adminai
      ORION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector
        run: PGPASSWORD=adminai psql -h localhost -U adminai -d adminai -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        run: ruff check app tests

      - name: Test (includes migrations and the demo evaluation)
        run: pytest -q -rs
